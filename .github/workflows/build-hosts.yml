name: Build Hosts

# 发版即构建:打 vX.Y.Z tag 触发(tag 必须与 package.json 的 version 一致),
# 产物发布到同名 Release。日常 push 不再触发构建。
#
#   pnpm version patch   # bump package.json + 自动打 vX.Y.Z tag
#   git push --follow-tags
#
# 临时手动构建用 workflow_dispatch(产物仅进 artifacts,不发 Release)。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: host-build-${{ github.ref }}
  # 发版 tag 不允许被后一次构建取消;其他触发才取消旧构建。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  prepare:
    name: JS build and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # tag 触发时校验:tag 必须等于 package.json 的 version(带 v 前缀)
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi
          echo "version=$PKG_VERSION ok"
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm test
      # build:host = build + gen-native-host + copy into both host projects
      - run: pnpm run build:host
      - name: Share bundles and host metadata
        uses: actions/upload-artifact@v5
        with:
          name: js-bundles
          path: |
            .build/native-host.json
            host/android/app/src/main/assets/
            host/ios/PomeloLynx/*.bundle
            host/ios/PomeloLynx/native-host.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK (debug)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: js-bundles
          path: .
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v5
      - name: Build debug APK
        working-directory: host/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: pomelo-lynx-android-debug
          path: host/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS IPA (unsigned)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: js-bundles
          path: .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Select Xcode and compute cache id
        id: xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          TOOLCHAIN=$(xcodebuild -version)
          SDK=$(xcrun --sdk iphoneos --show-sdk-build-version)
          OS_BUILD=$(sw_vers -buildVersion)
          printf '%s\n' "$TOOLCHAIN" "iPhoneOS SDK build: $SDK" "macOS build: $OS_BUILD"
          CACHE_ID=$(printf '%s\n' "$TOOLCHAIN" "$SDK" "$OS_BUILD" | shasum -a 256 | cut -d ' ' -f1)
          echo "cache_id=$CACHE_ID" >> "$GITHUB_OUTPUT"
      # Xcode 的内容寻址编译缓存可以跨全新 checkout 复用;只缓存 DerivedData
      # 会因文件 mtime 变化而失效。这是 iOS job 耗时从十几分钟降到几分钟的关键。
      - name: Restore iOS compilation and CocoaPods caches
        id: ios-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .build/ios-compilation-cache
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-compile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_id }}-${{ hashFiles('host/ios/pods.rb', 'host/ios/Podfile', 'host/ios/release/Podfile', 'host/ios/release/Podfile.lock', 'host/ios/PomeloLynx.xcodeproj/project.pbxproj') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-compile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_id }}-${{ hashFiles('host/ios/pods.rb', 'host/ios/Podfile', 'host/ios/release/Podfile', 'host/ios/release/Podfile.lock', 'host/ios/PomeloLynx.xcodeproj/project.pbxproj') }}-
      # CI 使用 host/ios/release/Podfile:不含 LynxService/Devtool,编译更快、
      # 体积更小。产物用独立 bundle id,可与本地开发版同时安装。
      - name: pod install (CI graph, without Devtool)
        id: pods
        working-directory: host/ios/release
        run: |
          set -euo pipefail
          if [ -f Podfile.lock ]; then
            echo "lock_committed=true" >> "$GITHUB_OUTPUT"
            pod _1.16.2_ install --deployment
          else
            echo "lock_committed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::host/ios/release/Podfile.lock 尚未提交;本次按常规解析安装,并把生成的 lockfile 作为 artifact 上传,提交后自动启用 --deployment"
            pod _1.16.2_ install
          fi
      - name: Share generated Podfile.lock (first run only)
        if: steps.pods.outputs.lock_committed == 'false'
        uses: actions/upload-artifact@v5
        with:
          name: ios-release-Podfile.lock
          path: host/ios/release/Podfile.lock
          if-no-files-found: error
          retention-days: 7
      - name: Parse project
        working-directory: host/ios
        run: xcodebuild -list -workspace PomeloLynx.xcworkspace
      - name: Build (iPhoneOS device, unsigned)
        working-directory: host/ios
        run: |
          set -o pipefail
          # 完整输出直接进日志:不静音、不裁剪、不做摘要过滤。
          xcodebuild -workspace PomeloLynx.xcworkspace -scheme PomeloLynx \
            -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-device \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$GITHUB_WORKSPACE/.build/ios-compilation-cache" \
            PRODUCT_BUNDLE_IDENTIFIER=org.pomelo.lynx.ci \
            POMELO_DISPLAY_NAME='Pomelo Lynx CI' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build
      - name: Save iOS compilation and CocoaPods caches
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: |
            .build/ios-compilation-cache
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Package unsigned device IPA
        run: |
          set -euo pipefail
          APP=host/ios/build/DerivedData-device/Build/Products/Debug-iphoneos/PomeloLynx.app
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry pomelo-lynx-ios-nosign.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v5
        with:
          name: pomelo-lynx-ios-nosign
          path: pomelo-lynx-ios-nosign.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release (tag builds only)
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: pomelo-lynx-ios-nosign
          path: .
      - uses: actions/download-artifact@v5
        with:
          name: pomelo-lynx-android-debug
          path: .
      - name: Rename artifacts with version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mv pomelo-lynx-ios-nosign.ipa "pomelo-lynx-ios-${VERSION}-nosign.ipa"
          mv app-debug.apk "pomelo-lynx-android-${VERSION}-debug.apk"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "pomelo-lynx ${GITHUB_REF_NAME}" \
            --notes "真机 arm64 未签名 IPA(TrollStore 或自行重签,iOS 15+)与 Android debug APK。"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            pomelo-lynx-ios-*.ipa pomelo-lynx-android-*.apk
