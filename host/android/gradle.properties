org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# minSdk 21 (< 24) turns on D8 desugaring of Java 8 default interface methods:
# the body moves to an `Interface$-CC` class and every implementer gets a
# forwarding method injected. By default AGP dexes each external library on its
# own, deriving the desugaring classpath from that library's *declared* POM
# dependencies — so a library whose POM omits the module holding the interface
# gets desugared blind and calls die with AbstractMethodError at runtime.
# `lynx-service-devtool`'s POM declares only `service-api` + `debug-router`,
# but `ILynxDevToolService` lives in the `lynx` artifact (same failure
# songloft-player-lynx hit; see its gradle.properties comment).
