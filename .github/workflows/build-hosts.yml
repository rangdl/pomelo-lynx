name: Build Hosts

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    branches: [main, master]
    paths-ignore: ["**.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: host-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    name: JS build and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm test
      # build:host = build + gen-native-host + copy into both host projects
      - run: pnpm run build:host
      - name: Share bundles and host metadata
        uses: actions/upload-artifact@v4
        with:
          name: js-bundles
          path: |
            .build/native-host.json
            host/android/app/src/main/assets/
            host/ios/PomeloLynx/*.bundle
            host/ios/PomeloLynx/native-host.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK (debug)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: js-bundles
          path: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: host/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pomelo-lynx-android-debug
          path: host/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS IPA (unsigned)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: js-bundles
          path: .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: pod install
        working-directory: host/ios
        run: pod _1.16.2_ install
      - name: Parse project
        working-directory: host/ios
        run: xcodebuild -list -workspace PomeloLynx.xcworkspace
      - name: Build (iPhoneOS device, unsigned)
        working-directory: host/ios
        run: |
          set -o pipefail
          xcodebuild -workspace PomeloLynx.xcworkspace -scheme PomeloLynx \
            -configuration Debug -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-device \
            -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild-device.log | tail -50
          grep -E "error:|BUILD" /tmp/xcodebuild-device.log | tail -100 >> build-errors.txt || true
      - name: Package unsigned device IPA
        run: |
          set -euo pipefail
          APP=host/ios/build/DerivedData-device/Build/Products/Debug-iphoneos/PomeloLynx.app
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry pomelo-lynx-ios-nosign.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-build-errors
          path: host/ios/build-errors.txt
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: pomelo-lynx-ios-nosign
          path: pomelo-lynx-ios-nosign.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Publish to release (rolling ipa-dev tag)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=ipa-dev
          # 滚动 tag:每个 push 覆盖同一个 release,直链永远指向最新构建
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "iOS 未签名 IPA (dev)" \
            --notes "真机 arm64 未签名 ipa,对应 run ${{ github.run_id }} (${{ github.sha }})。安装前需 TrollStore 或自行重签(iOS 15+)。"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber pomelo-lynx-ios-nosign.ipa
