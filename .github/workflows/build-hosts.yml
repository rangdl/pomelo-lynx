name: Build Hosts

# 发版即构建:打 vX.Y.Z tag 触发(tag 必须与 package.json 的 version 一致),
# 产物发布到同名 Release。master push 也触发构建并滚动发布到 `dev` 预发布
# Release(prerelease,固定资产名覆盖,dev tag 随 master 移动)——它同时是
# 热更新 dev 通道(releases/tags/dev)的更新源。
#
#   pnpm release:patch   # bump package.json + 同步原生版本字段 + 本地 commit/tag
#   git push --follow-tags   # 批准后再推送,才会触发正式发版
#
# 临时手动构建用 workflow_dispatch。

on:
  push:
    tags: ["v*"]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: host-build-${{ github.ref }}
  # 发版 tag 不允许被后一次构建取消;其他触发才取消旧构建。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  prepare:
    name: JS build and bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # tag 触发时校验:tag 必须等于 package.json 的 version(带 v 前缀)
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $TAG_VERSION 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi
          echo "version=$PKG_VERSION ok"
      # iOS 的 MARKETING_VERSION 由 `pnpm release:*` 的 version 钩子同步;
      # 手工改 package.json 时这里会拦住漂移。
      - name: Verify iOS MARKETING_VERSION matches package.json
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          PBX_VERSION=$(grep -m1 'MARKETING_VERSION = ' host/ios/PomeloLynx.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);/\1/')
          if [ "$PKG_VERSION" != "$PBX_VERSION" ]; then
            echo "::error::package.json version $PKG_VERSION != pbxproj MARKETING_VERSION $PBX_VERSION;请用 pnpm release:patch|minor|major 升版本"
            exit 1
          fi
          echo "native version=$PKG_VERSION ok"
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm test
      # build:host = build + gen-native-host + copy into both host projects
      - run: pnpm run build:host
      - name: Share bundles and host metadata
        uses: actions/upload-artifact@v7
        with:
          name: js-bundles
          path: |
            .build/native-host.json
            .build/version.json
            host/android/app/src/main/assets/
            host/ios/PomeloLynx/*.bundle
            host/ios/PomeloLynx/native-host.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Android 构建暂停(2026-10):JS bundle 产物仍由 prepare job 产出并随
  # release/prerelease 发布(热更新 dev 通道更新源不受影响)。恢复方案与
  # 实时开发(dev server 热加载 + devtool 门控)记录在 docs/dev-server.md。
  # android:
  #   name: Android APK (release)
  #   needs: prepare
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/download-artifact@v8
  #       with:
  #         name: js-bundles
  #         path: .
  #     - uses: actions/setup-java@v5
  #       with:
  #         distribution: temurin
  #         java-version: "17"
  #     - uses: android-actions/setup-android@v4
  #       with:
  #         packages: platform-tools platforms;android-34 build-tools;34.0.0
  #     - uses: gradle/actions/setup-gradle@v5
  #     - name: Build debug APK
  #       working-directory: host/android
  #       run: ./gradlew --no-daemon assembleRelease :app:testDebugUnitTest
  #     - uses: actions/upload-artifact@v7
  #       with:
  #         name: pomelo-lynx-android-release
  #         path: host/android/app/build/outputs/apk/release/app-release.apk
  #         if-no-files-found: error
  #         retention-days: 7

  ios:
    name: iOS IPA (unsigned)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: js-bundles
          path: .
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document
      - name: Select Xcode and compute cache id
        id: xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          TOOLCHAIN=$(xcodebuild -version)
          SDK=$(xcrun --sdk iphoneos --show-sdk-build-version)
          OS_BUILD=$(sw_vers -buildVersion)
          printf '%s\n' "$TOOLCHAIN" "iPhoneOS SDK build: $SDK" "macOS build: $OS_BUILD"
          CACHE_ID=$(printf '%s\n' "$TOOLCHAIN" "$SDK" "$OS_BUILD" | shasum -a 256 | cut -d ' ' -f1)
          echo "cache_id=$CACHE_ID" >> "$GITHUB_OUTPUT"
      # Xcode 的内容寻址编译缓存可以跨全新 checkout 复用;只缓存 DerivedData
      # 会因文件 mtime 变化而失效。这是 iOS job 耗时从十几分钟降到几分钟的关键。
      # 键里刻意不含 project.pbxproj:发版会改 MARKETING_VERSION,而 CAS 以编译
      # 命令为键,工程设置变化不会误命中旧对象。
      - name: Restore iOS compilation and CocoaPods caches
        id: ios-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .build/ios-compilation-cache
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ios-compile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_id }}-${{ hashFiles('host/ios/pods.rb', 'host/ios/Podfile', 'host/ios/release/Podfile', 'host/ios/release/Podfile.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-compile-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.cache_id }}-${{ hashFiles('host/ios/pods.rb', 'host/ios/Podfile', 'host/ios/release/Podfile', 'host/ios/release/Podfile.lock') }}-
      # dev 通道(master push / workflow_dispatch)用本地 Podfile graph
      # (devtools: true)+ Debug configuration:侧载包自带 Lynx Inspector,
      # 可通过 agent-lynx 连接调试,与本地 Xcode Debug 构建同构
      # (bundle id org.pomelo.lynx.debug)。tag 正式发版仍用 release/Podfile
      # (devtools: false)+ Release configuration:体积小、无 Inspector。
      # 两套 Podfile 共用同一 Pods 沙盒(pods.rb 设计),一次 job 只装一套。
      - name: Select build mode
        id: mode
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "podfile_dir=release" >> "$GITHUB_OUTPUT"
            echo "configuration=Release" >> "$GITHUB_OUTPUT"
          else
            echo "podfile_dir=." >> "$GITHUB_OUTPUT"
            echo "configuration=Debug" >> "$GITHUB_OUTPUT"
          fi
      - name: pod install (CI graph)
        id: pods
        working-directory: host/ios/${{ steps.mode.outputs.podfile_dir }}
        run: |
          set -euo pipefail
          if [ -f Podfile.lock ]; then
            echo "lock_committed=true" >> "$GITHUB_OUTPUT"
            pod _1.16.2_ install --deployment
          else
            echo "lock_committed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Podfile.lock 尚未提交;本次按常规解析安装,并把生成的 lockfile 作为 artifact 上传,提交后自动启用 --deployment"
            pod _1.16.2_ install
          fi
      - name: Share generated Podfile.lock (first run only)
        if: steps.pods.outputs.lock_committed == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ steps.mode.outputs.podfile_dir == 'release' && 'release-' || '' }}Podfile.lock
          path: host/ios/${{ steps.mode.outputs.podfile_dir == 'release' && 'release/' || '' }}Podfile.lock
          if-no-files-found: error
          retention-days: 7
      # 热更新验签/状态机:真实 Security+CryptoKit+disk,无需 pods(纯 Foundation)。
      # 原生回退实验期间(仓库无 BundleUpdateTransfer.swift)自动跳过。
      - name: Verify updater with Apple Security and real disk state
        run: |
          set -euo pipefail
          if [ ! -f host/ios/PomeloLynx/BundleUpdateTransfer.swift ]; then
            echo "::notice::BundleUpdateTransfer.swift 不存在(原生回退实验中),跳过 updater verify"
            exit 0
          fi
          swiftc -swift-version 5 host/ios/PomeloLynx/BundleUpdateStore.swift host/ios/PomeloLynx/BundleUpdateTransfer.swift scripts/verify-ios-updater.swift -o "$RUNNER_TEMP/verify-ios-updater"
          "$RUNNER_TEMP/verify-ios-updater" updates/fixtures/signature-v1.json
      - name: Parse project
        working-directory: host/ios
        run: xcodebuild -list -workspace PomeloLynx.xcworkspace
      - name: Build (iPhoneOS device, unsigned)
        working-directory: host/ios
        run: |
          set -o pipefail
          # 完整输出直接进日志:不静音、不裁剪、不做摘要过滤。
          xcodebuild -workspace PomeloLynx.xcworkspace -scheme PomeloLynx \
            -configuration ${{ steps.mode.outputs.configuration }} -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-device \
            -showBuildTimingSummary \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            COMPILATION_CACHE_ENABLE_DIAGNOSTIC_REMARKS=YES \
            COMPILATION_CACHE_CAS_PATH="$GITHUB_WORKSPACE/.build/ios-compilation-cache" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' CODE_SIGN_STYLE=Manual AD_HOC_CODE_SIGNING_ALLOWED=NO \
            build
      - name: Save iOS compilation and CocoaPods caches
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: |
            .build/ios-compilation-cache
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: ${{ steps.ios-cache.outputs.cache-primary-key }}
      - name: Package unsigned device IPA
        run: |
          set -euo pipefail
          APP=host/ios/build/DerivedData-device/Build/Products/${{ steps.mode.outputs.configuration }}-iphoneos/PomeloLynx.app
          test -d "$APP"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry pomelo-lynx-ios-nosign.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v7
        with:
          name: pomelo-lynx-ios-nosign
          path: pomelo-lynx-ios-nosign.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release (tag builds only)
    needs: [ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: pomelo-lynx-ios-nosign
          path: .
      # 安卓构建暂停:无 pomelo-lynx-android-release 产物可下载,
      # release 资产只含 iOS IPA + 热更新文件。恢复安卓时同步还原本段。
      - uses: actions/download-artifact@v8
        with:
          name: js-bundles
          path: js-bundles
      - name: Assemble release directory and sign update manifest
        env:
          # 未配置(默认)时只出完整包,bundle_update 为 null,不发布热更新资产。
          POMELO_UPDATE_PUBLIC_KEY: ${{ vars.POMELO_UPDATE_PUBLIC_KEY }}
          POMELO_UPDATE_PRIVATE_KEY: ${{ secrets.POMELO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-files
          mv pomelo-lynx-ios-nosign.ipa release-files/pomelo-lynx-ios-nosign.ipa
          # version.json:与 js job 同源的构建身份(gen-native-host 同一时刻生成,
          # 保证 native-host.json 与 release 元数据完全一致——finalize 会逐字段对拍)
          cp js-bundles/.build/version.json release-files/version.json
          if [ -n "${POMELO_UPDATE_PRIVATE_KEY:-}" ]; then
            node scripts/finalize-release.mjs release-files \
              js-bundles/host/android/app/src/main/assets/main.lynx.bundle \
              js-bundles/.build/native-host.json
          else
            node scripts/finalize-release.mjs release-files
          fi
          # 上传名带版本号;热更新资产(bundle/签名/manifest/checksums)保持固定名
          cp release-files/pomelo-lynx-ios-nosign.ipa "pomelo-lynx-ios-${VERSION}-nosign.ipa"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "pomelo-lynx ${GITHUB_REF_NAME}" \
            --notes "iOS:真机 arm64 未签名 IPA(TrollStore 或自行重签,iOS 15+)。dev 通道(master 构建)带 Inspector(Debug configuration,bundle id org.pomelo.lynx.debug);tag 正式版不带。热更新:配置签名密钥后附带 signed bundle(version.json/version.json.sig/pomelo-lynx-main.lynx.bundle/checksums.txt),dev 通道装 dev 包可热更。"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            pomelo-lynx-ios-*.ipa \
            release-files/version.json release-files/checksums.txt || true
          if [ -f release-files/version.json.sig ]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              release-files/version.json.sig release-files/pomelo-lynx-main.lynx.bundle
          fi

  # 预发布:非 tag 构建(master push / workflow_dispatch)成功后,把产物滚动
  # 发布到固定 `dev` Release(prerelease,固定资产名覆盖旧文件),并把 dev tag
  # 移到本次 commit。它同时是热更新 dev 通道的更新源(JS 侧查 releases/tags/dev)。
  prerelease:
    name: Prerelease (dev, rolling)
    needs: [ios]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: pomelo-lynx-ios-nosign
          path: .
      # 安卓构建暂停:无 pomelo-lynx-android-release 产物可下载,
      # dev 预发布资产只含 iOS IPA + 热更新文件。恢复安卓时同步还原本段。
      - uses: actions/download-artifact@v8
        with:
          name: js-bundles
          path: js-bundles
      - name: Assemble dev release directory
        env:
          POMELO_UPDATE_PUBLIC_KEY: ${{ vars.POMELO_UPDATE_PUBLIC_KEY }}
          POMELO_UPDATE_PRIVATE_KEY: ${{ secrets.POMELO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          mv pomelo-lynx-ios-nosign.ipa release-files/pomelo-lynx-ios-nosign.ipa
          cp js-bundles/.build/version.json release-files/version.json
          if [ -n "${POMELO_UPDATE_PRIVATE_KEY:-}" ]; then
            node scripts/finalize-release.mjs release-files \
              js-bundles/host/android/app/src/main/assets/main.lynx.bundle \
              js-bundles/.build/native-host.json
          else
            node scripts/finalize-release.mjs release-files
          fi
      - name: Publish rolling dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA::7}"
          # 已存在的 dev release:删旧资产 + 覆盖;不存在则创建。
          if gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete dev --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          git push origin ":refs/tags/dev" 2>/dev/null || true
          git tag dev "$GITHUB_SHA" && git push origin dev
          gh release create dev --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "pomelo-lynx dev ($SHORT)" \
            --notes "滚动预发布(master@$SHORT)。iOS:未签名 Debug IPA(TrollStore/自行重签,带 Inspector,org.pomelo.lynx.debug,可连 dev server 实时开发,见 docs/dev-server.md)。此 Release 是热更新 dev 通道的更新源,资产固定名,每次 master 构建覆盖。"
          gh release upload dev --repo "$GITHUB_REPOSITORY" --clobber \
            release-files/pomelo-lynx-ios-nosign.ipa \
            release-files/version.json release-files/checksums.txt
          if [ -f release-files/version.json.sig ]; then
            gh release upload dev --repo "$GITHUB_REPOSITORY" --clobber \
              release-files/version.json.sig release-files/pomelo-lynx-main.lynx.bundle
          fi
