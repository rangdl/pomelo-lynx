<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pomelo-lynx Web 预览</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; }
    #bar {
      display: flex; gap: 8px; align-items: center;
      padding: 8px 12px; background: #1a1d25; color: #eee;
      font-size: 14px;
    }
    #bar select { flex: 0 0 auto; }
    #bar span { opacity: .6; }
    lynx-view { width: 100vw; height: calc(100vh - 37px); }
  </style>
</head>
<body>
  <div id="bar">
    <label>Bundle:
      <select id="bundle">
        <option value="/main.web.bundle">main(示例应用)</option>
        <option value="/probe.web.bundle" selected>probe(对齐探针)</option>
      </select>
    </label>
    <span id="status"></span>
  </div>
  <link rel="stylesheet" href="/web-core/client_prod/static/css/client.css">
  <!--
    The `url` attribute is intentionally NOT set here: it is assigned by the
    module script below, so that `?bundle=…` selects exactly one bundle to
    load. Setting it here as well would make the view load the default bundle
    first and only then switch, which leaves the previous bundle's DOM alive
    long enough for an automated check to read stale content.
  -->
  <lynx-view id="view"></lynx-view>
  <script type="importmap">
    {
      "imports": {
        "@lynx-js/web-core/client": "/web-core/client_prod/static/js/client.js",
        "@lynx-js/web-elements": "/web-core/node_modules/@lynx-js/web-elements/dist/elements/index.js",
        "@lynx-js/web-elements/all": "/web-core/node_modules/@lynx-js/web-elements/dist/elements/all.js",
        "@lynx-js/web-worker-rpc": "/web-core/node_modules/@lynx-js/web-worker-rpc/dist/index.js",
        "@lynx-js/animax": "/web-core/node_modules/@lynx-js/animax/dist/index.js"
      }
    }
  </script>
  <script type="module">
    // web-elements 把实现注册为 x-blur-view;Lynx 页面用的是 blur-view。
    // 等实现就绪后做一次幂等别名,web-core 以后自己注册 blur-view 时自动跳过。
    customElements.whenDefined('x-blur-view').then((base) => {
      if (!base || customElements.get('blur-view')) return;
      customElements.define('blur-view', class extends base {});
    });
  </script>
  <script type="module">
    import '@lynx-js/web-core/client';

    const view = document.getElementById('view');
    const status = document.getElementById('status');
    const select = document.getElementById('bundle');

    // `?bundle=probe.web.bundle` picks the bundle to load, so an automated
    // run gets a fresh page with exactly the bundle it asked for.
    const requested = new URLSearchParams(location.search).get('bundle');
    const initial = requested ? `/${requested}` : select.value;
    if (Array.from(select.options).some((option) => option.value === initial)) {
      select.value = initial;
    }
    view.setAttribute('url', initial);

    select.addEventListener('change', (e) => {
      view.setAttribute('url', e.target.value);
    });
    view.addEventListener('url updated', () => { status.textContent = `加载中: ${view.getAttribute('url')}`; });
    window.addEventListener('error', (ev) => { status.textContent = `错误: ${ev.message}`; });
  </script>
</body>
</html>
